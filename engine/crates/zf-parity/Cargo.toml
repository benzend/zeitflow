[package]
name = "zf-parity"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Replay handwritten workflow fixtures through zf-core"

[[bin]]
name = "zf-parity"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
zf-core = { version = "0.1.0", path = "../zf-core" }

[lints]
workspace = true
