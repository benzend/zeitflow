name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: zeitflow-linux-x86_64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: zeitflow-linux-aarch64
            cross: true

          - target: x86_64-apple-darwin
            os: macos-13
            artifact: zeitflow-macos-x86_64

          - target: aarch64-apple-darwin
            os: macos-14
            artifact: zeitflow-macos-aarch64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: zeitflow-windows-x86_64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.artifact }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Install cross (Linux aarch64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross
        working-directory: cli
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: "!matrix.cross"
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cp cli/target/${{ matrix.target }}/release/zeitflow zeitflow
          chmod +x zeitflow
          tar czf ${{ matrix.artifact }}.tar.gz zeitflow
          rm zeitflow

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item "cli/target/${{ matrix.target }}/release/zeitflow.exe" "zeitflow.exe"
          Compress-Archive -Path "zeitflow.exe" -DestinationPath "${{ matrix.artifact }}.zip"
          Remove-Item "zeitflow.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#cli-}"

          gh release create "$TAG" \
            --title "ZeitFlow CLI $VERSION" \
            --generate-notes \
            artifacts/*
