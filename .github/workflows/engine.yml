name: Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: ts-rs bindings are up to date
        working-directory: ${{ github.workspace }}
        run: |
          status=$(git status --porcelain -- engine/bindings)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Node dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Parity harness
        working-directory: ${{ github.workspace }}
        run: pnpm tsx engine/scripts/parity.ts

  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # cargo-deny shells out to cargo from the repo root, which does not
      # see engine/rust-toolchain.toml. Install 1.99 so edition 2024 parses.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: engine/Cargo.toml
